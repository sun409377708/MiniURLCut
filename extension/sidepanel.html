<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniURLCut</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <h1>MiniURLCut</h1>
      <input
        id="urlInput"
        type="url"
        placeholder="粘贴公众号文章链接，例如 https://mp.weixin.qq.com/s/..."
        autocomplete="off"
        spellcheck="false"
      />
      <div class="toolbar">
        <button id="extractBtn" type="button">开始解析</button>
        <button id="useCurrentBtn" type="button" class="ghost">填入当前页</button>
        <button id="downloadHtmlBtn" type="button" disabled>下载 HTML</button>
        <button id="downloadTxtBtn" type="button" disabled>下载 TXT</button>
      </div>
      <p id="status" class="status">输入文章链接后点「开始解析」。</p>
    </header>

    <section class="pane">
      <div class="pane-head">
        <strong>范围选择</strong>
        <button id="fullBtn" type="button" class="linkish" disabled>看全文</button>
      </div>
      <p class="hint shift-hint">单击选一块。<strong>按住 Shift 再点另一块</strong>，即可左右连选多块。</p>
      <p id="rangeMeta" class="hint">尚未抽取</p>
      <ol id="blockList"></ol>
    </section>

    <section class="pane preview">
      <div class="pane-head">
        <div class="tabs">
          <button class="tab active" data-tab="formatted" type="button">预览</button>
          <button class="tab" data-tab="text" type="button">TXT</button>
        </div>
        <span id="previewMeta"></span>
      </div>
      <iframe id="formattedView" class="view wechat" title="正文预览" sandbox="allow-same-origin"></iframe>
      <pre id="textView" class="view hidden"></pre>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
